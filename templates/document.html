{% extends 'base.html' %}{% block content %}<div class="doc-toolbar"><div><p class="eyebrow">GENERATED DOCUMENT #{{doc.id}}</p><h1>{{doc.document_type}}</h1><p>{{doc.client_name}} · {{doc.jurisdiction}}</p></div><div><a class="btn secondary" href="{{url_for('generate')}}">New</a> <a class="btn" href="{{url_for('download',doc_id=doc.id)}}">Download PDF</a></div></div><article class="paper">{% for block in doc.content.split('\n\n') %}<p>{{block|replace('\n','<br>')|safe}}</p>{% endfor %}</article>{% endblock %}
